name: Build and Deploy to Render

on:
  push:
    branches:
      - dev  # only deploy when dev branch is updated

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for DATABASE_URL secret
        if: env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL secret not set. Please add it to your GitHub repository secrets."
          exit 1

      - name: Build migration image
        run: docker build -t migrate-image -f Dockerfile.migrate .

      - name: Run database migrations
        run: docker run --rm -e DATABASE_URL=${{ env.DATABASE_URL }} migrate-image

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp target/release/appliq deploy/app
          cp -r db resources deploy/
          cp Dockerfile deploy/Dockerfile
          cd deploy
          tar -czf ../deploy.tar.gz .
          cd ..
          ls -lh deploy.tar.gz

      - name: Trigger Render deploy with tarball
        run: |
          echo "🚀 Uploading tarball to Render..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -F "tar=@deploy.tar.gz")

          http_code=$(tail -n1 <<< "$response")
          body=$(head -n -1 <<< "$response")

          echo "🔍 Render API response:"
          echo "$body"

          if [ "$http_code" -ne 201 ]; then
            echo "❌ Failed to trigger Render deploy. HTTP status: $http_code"
            exit 1
          fi

          echo "✅ Successfully triggered Render deploy with tarball."
