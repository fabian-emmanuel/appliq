name: Build and Deploy to Render

on:
  push:
    branches:
      - dev

permissions:
  contents: write  # Allows pushing commits
  actions: read

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for DATABASE_URL secret
        if: env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL secret not set. Please add it to your GitHub repository secrets."
          exit 1

      - name: Build migration image
        run: docker build -t migrate-image -f Dockerfile.migrate .

      - name: Run database migrations
        run: docker run --rm -e DATABASE_URL=${{ env.DATABASE_URL }} migrate-image

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install faster linker
        run: sudo apt-get update && sudo apt-get install -y lld clang mold

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary (optimized)
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          export CARGO_INCREMENTAL=1
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_LTO=false
          cargo build --release

      - name: Prepare deploy folder
        run: |
          # Remove old deploy folder if it exists
          rm -rf deploy
          
          # Create new deploy folder
          mkdir -p deploy
          cp target/release/appliq deploy/app
          cp -r db resources deploy/
          
          # Create a simple Dockerfile for the pre-built binary
          cat > deploy/Dockerfile << 'EOF'
          FROM debian:bookworm-slim
          
          # Install runtime dependencies
          RUN apt-get update && apt-get install -y \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          
          # Set working directory
          WORKDIR /app
          
          # Copy pre-built binary and resources
          COPY app /usr/local/bin/app
          COPY db ./db
          COPY resources ./resources
          
          # Make binary executable
          RUN chmod +x /usr/local/bin/app
          
          # Expose port
          EXPOSE 8000
          
          # Run the binary
          CMD ["/usr/local/bin/app"]
          EOF
          
          # Make the binary executable
          chmod +x deploy/app

      - name: Create and push to deploy branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create or switch to deploy branch
          git checkout -B render-deploy
          
          # Add the deploy folder to git
          git add deploy/
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy: Update pre-built binary $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin render-deploy --force
          fi

      - name: Trigger Render Deploy
        run: |
          # Simple trigger since binary is now in the repo
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "manual"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$http_code" -ne 201 ]; then
            echo "Failed to trigger Render deploy. HTTP status code: $http_code"
            echo "Response body: $body"
            exit 1
          fi

          echo "Successfully triggered Render deploy."
          echo "Response body: $body"