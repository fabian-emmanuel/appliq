name: Build and Deploy to Render

on:
  push:
    branches:
      - dev

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for DATABASE_URL secret
        if: env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL secret not set. Please add it to your GitHub repository secrets."
          exit 1

      - name: Build migration image
        run: docker build -t migrate-image -f Dockerfile.migrate .

      - name: Run database migrations
        run: docker run --rm -e DATABASE_URL=${{ env.DATABASE_URL }} migrate-image

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp target/release/appliq deploy/app
          cp -r db resources deploy/

          # Copy runtime Dockerfile into deploy
          cp Dockerfile deploy/Dockerfile

      - name: Package deploy folder
        run: tar -czf deploy.tar.gz -C deploy .

      - name: Check for Render API Key
        if: env.RENDER_SERVICE_ID == ''
        run: |
          echo "RENDER_SERVICE_ID secret not set. Please add it to your GitHub repository secrets."
          exit 1

      - name: Upload prebuilt bundle to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -F "tar=@deploy.tar.gz" \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys"
