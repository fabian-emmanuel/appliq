name: Build and Deploy to Render

on:
  push:
    branches:
      - dev

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for DATABASE_URL secret
        if: env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL secret not set. Please add it to your GitHub repository secrets."
          exit 1

      - name: Build migration image
        run: docker build -t migrate-image -f Dockerfile.migrate .

      - name: Run database migrations
        run: docker run --rm -e DATABASE_URL=${{ env.DATABASE_URL }} migrate-image

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install faster linker
        run: sudo apt-get update && sudo apt-get install -y lld clang mold

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary (optimized)
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
          export CARGO_INCREMENTAL=1
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_LTO=false
          cargo build --release

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp target/release/appliq deploy/app
          cp -r db resources deploy/
          cp Dockerfile deploy/Dockerfile

      - name: Create tarball
        run: |
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload to Render
        run: |
          # Method 1: Using the correct API endpoint with proper headers
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$http_code" -eq 201 ]; then
            echo "Successfully triggered Render deploy."
            echo "Response body: $body"
          else
            echo "Method 1 failed, trying alternative approach..."
          
            # Method 2: Alternative approach using multipart form-data
            response=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
              --form-string 'type=manual' \
              --form 'file=@deploy.tar.gz;type=application/gzip')

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)

            if [ "$http_code" -ne 201 ]; then
              echo "Failed to trigger Render deploy. HTTP status code: $http_code"
              echo "Response body: $body"
          
              # Method 3: Try git-based deployment trigger
              echo "Trying git-based deployment trigger..."
              response=$(curl -s -w "\n%{http_code}" -X POST \
                "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
                -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "type": "manual"
                }')

              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | head -n -1)

              if [ "$http_code" -ne 201 ]; then
                echo "All deployment methods failed. Final HTTP status code: $http_code"
                echo "Final response body: $body"
                exit 1
              fi
            fi

            echo "Successfully triggered Render deploy."
            echo "Response body: $body"
          fi