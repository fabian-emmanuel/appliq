services:
  # PostgreSQL Database
  db:
    container_name: appliq-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appliq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appliq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appliq-network

  # RabbitMQ Message Broker (if needed for async processing)
  rabbitmq:
    container_name: appliq-rabbitmq
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - appliq-network

  # AppliQ Application
  app:
    container_name: appliq-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_IN_MINUTES=${JWT_EXPIRY_IN_MINUTES}
      - JWT_EXPIRY_FOR_30_DAYS_IN_MINUTES=${JWT_EXPIRY_FOR_30_DAYS_IN_MINUTES}
      - TOKEN_EXPIRY_IN_MINUTES=${TOKEN_EXPIRY_IN_MINUTES}
      - FRONTEND_URLS=${FRONTEND_URLS}
      - APP_URL=${APP_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - RUST_LOG=info
      - BIND_ADDRESS=0.0.0.0:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - appliq-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  appliq-network:
    driver: bridge